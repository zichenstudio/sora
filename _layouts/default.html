<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <script>
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
    </script>
  </head>
  <body>
    <div class="card-blog">
      {% include header.html %}
      <button id="theme-toggle" class="theme-toggle" aria-label="切换主题" title="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <div class="blog-grid">
        {{ content }}
      </div>
      {% include footer.html %}

      <div class="watermark-line">
        <i></i>
        <i style="width: 20px;"></i>
        <i style="width: 60px;"></i>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
    
    <script>
    (function () {
      var root = document.documentElement;
      var saved = localStorage.getItem('theme');
      if (saved) root.setAttribute('data-theme', saved);
    
      var HLJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/';
      var THEMES = {
        light: 'atom-one-light.min.css',
        dark:  'atom-one-dark.min.css'
      };
    
      // 当前已加载的 hljs 主题（'light' | 'dark' | null）
      var loadedHljsTheme = null;
    
      function getCurrentTheme() {
        var t = root.getAttribute('data-theme');
        if (t === 'dark') return 'dark';
        if (t === 'light') return 'light';
        return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    
      function loadHljsTheme(name) {
        if (loadedHljsTheme === name) return;          // 已加载，跳过
        loadedHljsTheme = name;
    
        var old = document.getElementById('hljs-theme');
        if (old) old.remove();                          // 移除旧主题
    
        var link = document.createElement('link');
        link.id = 'hljs-theme';
        link.rel = 'stylesheet';
        link.href = HLJS_BASE + THEMES[name];
        document.head.appendChild(link);                // 插到 head，避免闪烁
      }
    
      // 初始化
      loadHljsTheme(getCurrentTheme());
    
      // 切换按钮
      var btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.addEventListener('click', function () {
          var cur = getCurrentTheme();
          var next = cur === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          loadHljsTheme(next);
        });
      }
    
      // 跟随系统变化（仅在用户没手动切换时）
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        if (!root.getAttribute('data-theme')) {
          loadHljsTheme(getCurrentTheme());
        }
      });
    })();
    </script>
  </body>
</html>
