---
layout: default
---

<article class="blog-card post-card">
  <div class="card-meta">
    <span class="card-tags">
      {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    </span>
    <span class="date">{{ page.date | date: "%d.%m.%Y" }}</span>
  </div>

  <h1 class="post-title">{{ page.title }}</h1>
  <p id="word-count" class="reading-meta"></p>
  <div class="post-content" id="post-content">
    {{ content }}
  </div>
</article>

<script>
(function () {
  const el = document.querySelector('.post-content');
  if (!el) return;

  const clone = el.cloneNode(true);
  clone.querySelectorAll('script, style, pre, code, sup[id^="fnref"]').forEach(n => n.remove());

  const text = clone.textContent || '';
  const count = (text.match(/[\u4e00-\u9fa5]/g) || []).length;

  const out = document.getElementById('word-count');
  if (out) out.textContent = `全文约 ${count} 字`;
})();
</script>
