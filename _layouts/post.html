---
layout: default
---

<article class="blog-card post-card">
  <div class="card-meta">
    <span class="card-tags">
      {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    </span>
    <span class="date">{{ page.date | date: "%d.%m.%Y" }}</span>
  </div>

  <h1 class="post-title">{{ page.title }}</h1>

  <div class="post-content">
    {{ content }}
  </div>
</article>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/atom-one-light.min.css">
<script>hljs.highlightAll();</script>
